<ng-template ng-ref="example.customDay" let-date let-data="data" let-selected="selected" let-today="today" let-focused="focused">
    <span class="day" ng-class="{ selected: selected, today: today, weekend: data.weekend, focused: focused }">
        {{ date.day }}
        <i ng-if="today" class="bi bi-dot" aria-hidden="true"></i>
    </span>
</ng-template>
<ngb-datepicker ng-model="example.date" day-template="example.customDay" day-template-data="example.dayData"></ngb-datepicker>
