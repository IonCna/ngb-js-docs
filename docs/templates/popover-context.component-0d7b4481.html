<ng-template ng-ref="example.contentTemplate" let-greeting="greeting" _content-e34342c4="">{{ greeting }}, <strong _content-e34342c4="">{{ example.name }}</strong>!</ng-template>
<ng-template ng-ref="example.titleTemplate" let-language="language" _content-e34342c4="">Greeting in {{ language }}</ng-template>

<p _content-e34342c4="">You can pass context when manually opening a popover.</p>
<div class="d-flex flex-wrap gap-2 mb-4" _content-e34342c4="">
    <button type="button" class="btn btn-outline-secondary" ngb-popover="example.contentTemplate" popover-title="example.titleTemplate" triggers="'manual'" ng-ref="example.french" ng-ref-read="ngbPopover" ng-click="example.toggleWithGreeting(example.french, 'Bonjour', 'French')" _content-e34342c4="">French</button>
    <button type="button" class="btn btn-outline-secondary" ngb-popover="example.contentTemplate" popover-title="example.titleTemplate" triggers="'manual'" ng-ref="example.german" ng-ref-read="ngbPopover" ng-click="example.toggleWithGreeting(example.german, 'Guten Tag', 'German')" _content-e34342c4="">German</button>
    <button type="button" class="btn btn-outline-secondary" ngb-popover="example.contentTemplate" popover-title="example.titleTemplate" triggers="'manual'" ng-ref="example.english" ng-ref-read="ngbPopover" ng-click="example.toggleWithGreeting(example.english, 'Hello', 'English')" _content-e34342c4="">English</button>
</div>

<p _content-e34342c4="">Alternatively, provide a default context through <code _content-e34342c4="">popover-context</code>.</p>
<button type="button" class="btn btn-outline-secondary" ngb-popover="example.contentTemplate" popover-title="example.titleTemplate" popover-context="{ language: '中文', greeting: '你好' }" _content-e34342c4="">Chinese</button>
